{% extends 'base.html' %}

{% block content %}
<div class="bg-[#0F172A] text-[#E5E7EB] min-h-screen flex items-center justify-center px-6">

    <div class="w-full max-w-md bg-[#1E293B]/70 backdrop-blur-lg border border-gray-700 rounded-3xl shadow-2xl p-8 text-center">

        <!-- Heading -->
        <h2 class="text-2xl font-bold text-white mb-2">
            Complete Payment
        </h2>

        <p class="text-gray-400 mb-6">
            {{ booking.service.title }}
        </p>

        <!-- Price Card -->
        <div class="bg-[#0F172A] border border-gray-700 rounded-2xl py-6 mb-8">
            <p class="text-sm text-gray-400 mb-2">Total Amount</p>
            <div class="text-4xl font-bold text-[#22D3EE]">
                ₹{{ booking.service.price }}
            </div>
        </div>

        <!-- Pay Button -->
        <button onclick="payWithRazorpay()" 
            class="w-full py-3 rounded-xl bg-[#6366F1] hover:bg-indigo-500 transition-all font-semibold shadow-lg hover:shadow-indigo-500/30">
            Pay Securely 🚀
        </button>

        <!-- Secure note -->
        <p class="text-xs text-gray-500 mt-4">
            🔒 100% secure payment powered by Razorpay
        </p>

    </div>

</div>

<!-- Razorpay -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
function payWithRazorpay() {
    const options = {
        key: "{{ key_id }}",
        amount: "{{ amount }}",
        currency: "INR",
        name: "HomeHero",
        description: "{{ booking.service.title }}",
        order_id: "{{ order_id }}",

        handler: function (response) {
            console.log("Payment Success:", response);

            const formData = new URLSearchParams();
            formData.append('razorpay_order_id', response.razorpay_order_id);
            formData.append('razorpay_payment_id', response.razorpay_payment_id);
            formData.append('razorpay_signature', response.razorpay_signature);

            fetch("/payments/verify/", {
                method: "POST",
                headers: {
                    "X-CSRFToken": "{{ csrf_token }}",
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    alert("✅ Payment Successful!");
                    window.location.href = "{% url 'bookings:customer_dashboard' %}";
                } else {
                    alert("Payment verification failed.");
                }
            })
            .catch(err => {
                console.error(err);
                alert("Something went wrong.");
            });
        },

        modal: {
            ondismiss: function() {
                console.log("Checkout closed");
            }
        },

        theme: { color: "#6366F1" } // Indigo theme match
    };

    try {
        const rzp = new Razorpay(options);
        rzp.open();
    } catch (e) {
        console.error(e);
        alert("Razorpay failed to open.");
    }
}
</script>

{% endblock %}
