{% extends 'base.html' %}

{% block content %}
<div class="bg-[#0F172A] text-[#E5E7EB] min-h-screen py-12 px-6">

    <div class="service-form max-w-2xl mx-auto bg-[#1E293B]/70 backdrop-blur-lg border border-gray-700 rounded-3xl shadow-2xl p-8">

        <!-- Heading -->
        <h1 class="text-3xl font-bold text-white mb-8 flex items-center gap-3">
            <i class="fas fa-plus-circle text-[#22D3EE]"></i>
            Add New Service
        </h1>

        <!-- Form -->
        <form method="POST" enctype="multipart/form-data" class="space-y-5">
            {% csrf_token %}

            <!-- Title -->
            <div>
                <label class="block text-sm mb-1 text-gray-300">Service Title</label>
                {{ form.title }}
            </div>

            <!-- Category -->
            <div>
                <label class="block text-sm mb-1 text-gray-300">Category</label>
                {{ form.category }}
            </div>

            <!-- Price -->
            <div>
                <label class="block text-sm mb-1 text-gray-300">Price (₹)</label>
                {{ form.price }}
            </div>

            <!-- Description -->
            <div>
                <label class="block text-sm mb-1 text-gray-300">Description</label>
                {{ form.description }}
            </div>

            <!-- Image -->
            <div>
                <label class="block text-sm mb-1 text-gray-300">Service Image (Optional)</label>
                {{ form.image }}
            </div>

            <!-- Button -->
            <div class="pt-4">
                <button type="submit"
                    class="w-full py-3 rounded-xl bg-[#6366F1] hover:bg-indigo-500 transition-all font-semibold shadow-lg hover:shadow-indigo-500/30">
                    Add Service 🚀
                </button>
            </div>

        </form>

    </div>

</div>
{% endblock %}
