{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-3xl shadow-2xl p-10">
    <h1 class="text-4xl font-bold text-gray-800 mb-8 flex items-center gap-3">
        <i class="fas fa-plus-circle text-green-600"></i>
        Add New Service
    </h1>

    <form method="POST" enctype="multipart/form-data" class="space-y-6">
        {% csrf_token %}

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Service Title</label>
            {{ form.title }}
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Category</label>
            {{ form.category }}
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Price (₹)</label>
            {{ form.price }}
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
            {{ form.description }}
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Service Image (Optional)</label>
            {{ form.image }}
        </div>

        <div class="pt-8">
            <button type="submit" 
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-5 rounded-2xl text-xl transition-all">
                ✅ Add Service
            </button>
        </div>
    </form>
</div>
{% endblock %}
