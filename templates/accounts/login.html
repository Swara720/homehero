{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HomeHero</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0F172A] text-[#E5E7EB] flex items-center justify-center min-h-screen">

    <!-- Container -->
    <div class="w-full max-w-md">

        <!-- Card -->
        <div class="bg-[#1E293B]/70 backdrop-blur-lg border border-gray-700 rounded-3xl shadow-2xl p-8">

            <!-- Heading -->
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-white">Welcome Back 👋</h2>
                <p class="text-gray-400 mt-2">Login to your HomeHero account</p>
            </div>

            <!-- Messages -->
            {% if messages %}
                {% for message in messages %}
                    <div class="bg-red-500/20 text-red-400 px-4 py-2 rounded-lg mb-4 text-sm">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <!-- Form -->
            <form method="POST" class="space-y-5">
                {% csrf_token %}

                <!-- Username -->
                <div>
                    <label class="block text-sm mb-1 text-gray-300">Username</label>
                    <input type="text" name="username"
                        class="w-full px-4 py-3 rounded-xl bg-[#0F172A] border border-gray-600 focus:border-[#22D3EE] focus:ring-1 focus:ring-[#22D3EE] outline-none transition"
                        placeholder="Enter username" required>
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-sm mb-1 text-gray-300">Password</label>
                    <input type="password" name="password"
                        class="w-full px-4 py-3 rounded-xl bg-[#0F172A] border border-gray-600 focus:border-[#22D3EE] focus:ring-1 focus:ring-[#22D3EE] outline-none transition"
                        placeholder="Enter password" required>
                </div>

                <!-- Button -->
                <button type="submit"
                    class="w-full py-3 rounded-xl bg-[#6366F1] hover:bg-indigo-500 transition-all font-semibold shadow-lg hover:shadow-indigo-500/30">
                    Login
                </button>
            </form>

            <!-- Footer -->
            <div class="text-center mt-6 text-sm text-gray-400">
                Don’t have an account?
                <a href="{% url 'accounts:register' %}" 
                   class="text-[#22D3EE] hover:underline">
                   Register
                </a>
            </div>

        </div>

    </div>

</body>
</html>
