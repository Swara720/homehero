{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - HomeHero</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Target all inputs inside register page */
      .register-page input,
      .register-page select,
      .register-page textarea {
        width: 100%;
        padding: 12px 16px;
        border-radius: 12px;
        background-color: #0f172a;
        border: 1px solid #4b5563;
        color: #e5e7eb;
        font-size: 14px;
        outline: none;
        transition: all 0.3s ease;
      }

      /* Focus effect */
      .register-page input:focus,
      .register-page select:focus,
      .register-page textarea:focus {
        border-color: #22d3ee;
        box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.3);
      }

      /* Placeholder color */
      .register-page input::placeholder {
        color: #9ca3af;
      }

      /* Dropdown (select) fix */
      .register-page select {
        appearance: none;
        cursor: pointer;
      }

      /* Label styling */
      .register-page label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        color: #d1d5db;
      }

      /* Error styling */
      .register-page .errorlist {
        color: #f87171;
        font-size: 12px;
        margin-top: 4px;
        list-style: none;
        padding: 0;
      }

      /* Button (optional upgrade) */
      .register-page button {
        background: #6366f1;
        color: white;
        padding: 12px;
        border-radius: 12px;
        border: none;
        font-weight: 600;
        transition: 0.3s;
      }

      .register-page button:hover {
        background: #4f46e5;
        box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
      }
    </style>
  </head>

  <body
    class="bg-[#0F172A] text-[#E5E7EB] flex items-center justify-center min-h-screen"
  >
    <div class="w-full max-w-lg">
      <!-- Card -->
      <div
        class="register-page bg-[#1E293B]/70 backdrop-blur-lg border border-gray-700 rounded-3xl shadow-2xl p-8"
      >
        <!-- Heading -->
        <div class="text-center mb-8">
          <h2 class="text-3xl font-bold text-white">Create Account 🚀</h2>
          <p class="text-gray-400 mt-2">Join HomeHero today</p>
        </div>

        <!-- Form -->
        <form method="POST" class="space-y-5">
          {% csrf_token %}

          <!-- Username -->
          <div>
            <label class="block text-sm mb-1 text-gray-300">Username</label>
            {{ form.username|safe }}
          </div>

          <!-- Email -->
          <div>
            <label class="block text-sm mb-1 text-gray-300">Email</label>
            {{ form.email|safe }}
          </div>

          <!-- Phone -->
          <div>
            <label class="block text-sm mb-1 text-gray-300">Phone</label>
            {{ form.phone|safe }}
          </div>

          <!-- User Type -->
          <div>
            <label class="block text-sm mb-1 text-gray-300">User Type</label>
            {{ form.user_type|safe }}
          </div>

          <!-- Password -->
          <div>
            <label class="block text-sm mb-1 text-gray-300">Password</label>
            {{ form.password1|safe }}
          </div>

          <!-- Confirm Password -->
          <div>
            <label class="block text-sm mb-1 text-gray-300"
              >Confirm Password</label
            >
            {{ form.password2|safe }}
          </div>

          <!-- Button -->
          <button
            type="submit"
            class="w-full py-3 rounded-xl bg-[#6366F1] hover:bg-indigo-500 transition-all font-semibold shadow-lg hover:shadow-indigo-500/30"
          >
            Register
          </button>
        </form>

        <!-- Footer -->
        <div class="text-center mt-6 text-sm text-gray-400">
          Already have an account?
          <a
            href="{% url 'accounts:login' %}"
            class="text-[#22D3EE] hover:underline"
          >
            Login
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
