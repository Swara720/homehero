{% load static %}
<!DOCTYPE html>
<html>
  <head>
    <title>HomeHero</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'css/custom.css' %}" />
  </head>
  <body class="bg-primary home-page">
    <div class="container-fluid p-0 m-0">
      <nav class="navbar navbar-expand-lg bg-primary">
        <div class="container-fluid">
          <a class="navbar-brand text-white" href="#">HOME HERO</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse mx-auto" id="navbarNav">
            <ul class="navbar-nav text-white">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-white" href="/accounts/login">Admin</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-white" href="/accounts/login">Service Provider</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-white" href="/accounts/login">Customer</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
      <div
        id="carouselExampleSlidesOnly"
        class="carousel slide"
        data-bs-ride="carousel"
      >
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img
              src="{% static 'images/banner-images.jpg' %}"
              class="d-block w-100 img-fluid"
              alt="..."
            />
          </div>
        </div>
      </div>
    </div>
    <div class="container mt-5">
      <div class="row">
        {% for service in services %}
        <div class="col-md-4">
          <div class="card p-3 shadow mb-3">
            <h5>{{ service.title }}</h5>
            <p>{{ service.description }}</p>
            <p><strong>₹{{ service.price }}</strong></p>

            <a href="/bookings/book/{{ service.id }}" class="btn btn-primary">
              Book Now
            </a>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
      integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
      integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
