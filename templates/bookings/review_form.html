{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen bg-[#0F172A] text-white flex items-center justify-center px-6">

  <div class="w-full max-w-xl bg-[#1E293B] p-8 rounded-2xl shadow-lg">

    <h2 class="text-2xl font-bold mb-6 text-center">
      Submit Your Review ⭐
    </h2>

    <p class="text-gray-400 text-center mb-6">
      Booking ID: {{ booking.id }} | {{ booking.service.title }}
    </p>

    <form method="POST">
      {% csrf_token %}

      <!-- Rating -->
      <label class="block mb-2 text-sm text-gray-300">Rating (1 to 5)</label>
      <input type="number" name="rating" min="1" max="5" required
        class="w-full p-3 rounded-lg bg-[#0F172A] border border-gray-600 mb-4 text-white">

      <!-- Comment -->
      <label class="block mb-2 text-sm text-gray-300">Comment</label>
      <textarea name="comment" rows="4" required
        class="w-full p-3 rounded-lg bg-[#0F172A] border border-gray-600 mb-6 text-white"></textarea>

      <!-- Submit -->
      <button type="submit"
        class="w-full bg-green-600 hover:bg-green-500 py-3 rounded-xl font-semibold transition">
        Submit Review
      </button>

    </form>

  </div>

</div>
{% endblock %}
