{% extends 'base.html' %}

{% block content %}
<div class="bg-[#0F172A] text-[#E5E7EB] min-h-screen flex items-center justify-center px-6">

    <div class="booking-form w-full max-w-lg bg-[#1E293B]/70 backdrop-blur-lg border border-gray-700 rounded-3xl shadow-2xl p-8">

        <!-- Heading -->
        <h1 class="text-2xl font-bold text-white mb-2">
            Book Service
        </h1>

        <p class="text-gray-400 mb-6">
            {{ service.title }} - 
            <span class="text-[#22D3EE] font-semibold">₹{{ service.price }}</span>
        </p>

        <!-- Form -->
        <form method="POST" class="space-y-4">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit"
                class="w-full py-3 rounded-xl bg-[#6366F1] hover:bg-indigo-500 transition-all font-semibold shadow-lg hover:shadow-indigo-500/30 mt-4">
                Send Booking 🚀
            </button>
        </form>

    </div>

</div>
{% endblock %}
