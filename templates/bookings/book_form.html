{% extends 'base.html' %}

{% block content %}
<div class="max-w-lg mx-auto bg-white rounded-3xl shadow-2xl p-10">
    <h1 class="text-3xl font-bold mb-8">Book Service</h1>
    <h2 class="text-xl mb-6">{{ service.title }} - ₹{{ service.price }}</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full bg-blue-600 text-white py-5 rounded-2xl text-xl mt-8 hover:bg-blue-700">
            Send Booking Request
        </button>
    </form>
</div>
{% endblock %}
